<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560">
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <text x="40" y="64" font-size="28" font-family="Arial, sans-serif" fill="#111827">40-Pin Expansion Header (J12)</text>
  <rect x="280" y="96" width="340" height="420" rx="14" fill="#111827" opacity="0.08"/>
  <rect x="300" y="116" width="300" height="380" rx="12" fill="#ffffff" stroke="#111827" opacity="0.35"/>

  <g font-family="Arial, sans-serif" font-size="18" fill="#111827">
    <text x="170" y="140">3.3V</text>
    <text x="170" y="184">I2C1_SDA</text>
    <text x="170" y="228">I2C1_SCL</text>
    <text x="170" y="272">GPIO09</text>
    <text x="170" y="316">GND</text>
    <text x="170" y="360">UART1_RTS*</text>
    <text x="170" y="404">SPI1_SCK</text>
    <text x="170" y="448">GPIO12</text>
    <text x="170" y="492">3.3V</text>

    <text x="640" y="140">5.0V</text>
    <text x="640" y="184">5.0V</text>
    <text x="640" y="228">GND</text>
    <text x="640" y="272">UART1_TXD</text>
    <text x="640" y="316">UART1_RXD</text>
    <text x="640" y="360">I2S0_SCLK</text>
    <text x="640" y="404">GND</text>
