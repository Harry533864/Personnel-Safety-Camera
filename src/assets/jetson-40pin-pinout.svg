    <text x="560" y="268">8</text>
    <text x="340" y="312">9</text>
    <text x="560" y="312">10</text>
    <text x="338" y="356">11</text>
    <text x="558" y="356">12</text>
    <text x="338" y="400">13</text>
    <text x="558" y="400">14</text>
    <text x="338" y="444">15</text>
