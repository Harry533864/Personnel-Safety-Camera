      <circle cx="200" cy="0" r="10" fill="#ef4444"/>
      <circle cx="0" cy="44" r="10" fill="#111827" opacity="0.35"/>
      <circle cx="200" cy="44" r="10" fill="#ef4444"/>
      <circle cx="0" cy="88" r="10" fill="#111827" opacity="0.35"/>
      <circle cx="200" cy="88" r="10" fill="#22c55e"/>
      <circle cx="0" cy="132" r="10" fill="#22c55e"/>
