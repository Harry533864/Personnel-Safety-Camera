model:
  model_path: ../inference/models
  runtime_config_dir: ../inference/configs/runtime
  prestart_mode: false
  settle_single_frame: false
  jpeg_quality: 95
  version: '1.0'
  camera_id: cam_demo_001
  detect_enable: true
  infer_target: all
  model_name: Asva_person_v0518
  imgsz: 640
  conf_thres: 0.1
  iou_thres: 0.1
  enter_frames: 3
  exit_frames: 5
  class_name:
    - person
  person_class_ids:
    - 0
  rois:
  - roi_id: hazard_1
    name: ROI1
    enabled: true
    roi_type: forbidden_zone
    judge_method: overlap
    coordinate_mode: normalized
    polygon:
    - - 0.1214
      - 0.1517
    - - 0.4062
      - 0.1517
    - - 0.4062
      - 0.3613
    - - 0.1214
      - 0.3613
    overlap_thres: 0.1
    target: all
  - roi_id: hazard_2
    name: ROI2
    enabled: true
    roi_type: forbidden_zone
    judge_method: foot_point
    coordinate_mode: normalized
    polygon:
    - - 0.3975
      - 0.2543
    - - 0.6183
      - 0.2543
    - - 0.6183
      - 0.6914
    - - 0.3975
      - 0.6914
    overlap_thres: 0.1
    target: all
  - roi_id: hazard_3
    name: ROI3
    enabled: true
    roi_type: forbidden_zone
    judge_method: foot_point
    coordinate_mode: normalized
    polygon:
    - - 0.6797
      - 0.2587
    - - 0.952
      - 0.2587
    - - 0.952
      - 0.7227
    - - 0.6797
      - 0.7227
    overlap_thres: 0.1
    target: all
test:
  hot_reload: true
  image: ../inference/test_img/image.png
  interval: 0.5
  show: false
  save_path: ../outputs/python_tensorrt_result.jpg
model_names:
- yolo11
- yolo11_test
- yolo11_person
- Asva_person_v0518
exception_output:
